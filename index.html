<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Diagnóstico — Programación de Móviles II</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222; --accent:#e8ff47; --accent2:#47b8ff; --text:#f0f0f0; --muted:#666; --border:#2a2a2a; --correct:#47ff8a; --wrong:#ff4747; --radius:8px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; min-height:100vh; }
  header { background:var(--surface); border-bottom:2px solid var(--accent); padding:24px 40px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .header-left h1 { font-size:1.4rem; font-weight:800; letter-spacing:-0.5px; color:var(--accent); }
  .header-left p { font-size:0.8rem; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:4px; }
  .badge { background:var(--accent); color:#000; font-size:0.7rem; font-weight:700; padding:4px 10px; border-radius:20px; font-family:'IBM Plex Mono',monospace; letter-spacing:1px; }
  .progress-wrap { padding:16px 40px; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; }
  .progress-bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.4s ease; width:0%; }
  .progress-text { font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--muted); white-space:nowrap; }
  main { max-width:820px; margin:0 auto; padding:40px 24px 80px; }
  .question-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:32px; display:none; animation:fadeIn 0.3s ease; }
  .question-card.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .q-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .q-number { background:var(--accent); color:#000; font-weight:800; font-size:0.8rem; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .q-unit { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--accent2); background:rgba(71,184,255,0.1); padding:3px 10px; border-radius:20px; border:1px solid rgba(71,184,255,0.2); }
  .q-text { font-size:1.05rem; font-weight:600; line-height:1.5; margin-bottom:24px; color:var(--text); }
  .options { display:flex; flex-direction:column; gap:10px; }
  .option { background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius); padding:14px 18px; cursor:pointer; display:flex; align-items:center; gap:14px; transition:all 0.2s; font-size:0.92rem; line-height:1.4; }
  .option:hover:not(.disabled) { border-color:var(--accent); background:rgba(232,255,71,0.05); }
  .option-letter { font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:0.8rem; color:var(--muted); width:20px; flex-shrink:0; }
  .option.correct { border-color:var(--correct); background:rgba(71,255,138,0.08); }
  .option.correct .option-letter { color:var(--correct); }
  .option.wrong { border-color:var(--wrong); background:rgba(255,71,71,0.08); }
  .option.wrong .option-letter { color:var(--wrong); }
  .option.disabled { cursor:default; }
  .feedback { margin-top:18px; padding:14px 18px; border-radius:var(--radius); font-size:0.88rem; line-height:1.5; display:none; }
  .feedback.show { display:block; }
  .feedback.correct-fb { background:rgba(71,255,138,0.08); border:1px solid rgba(71,255,138,0.3); color:var(--correct); }
  .feedback.wrong-fb { background:rgba(255,71,71,0.08); border:1px solid rgba(255,71,71,0.3); color:#ff8080; }
  .nav-buttons { display:flex; justify-content:space-between; align-items:center; margin-top:28px; gap:12px; }
  .btn { font-family:'Syne',sans-serif; font-weight:700; font-size:0.85rem; padding:12px 24px; border-radius:var(--radius); border:none; cursor:pointer; transition:all 0.2s; letter-spacing:0.5px; }
  .btn-primary { background:var(--accent); color:#000; }
  .btn-primary:hover { background:#d4eb00; transform:translateY(-1px); }
  .btn-secondary { background:transparent; color:var(--muted); border:1px solid var(--border); }
  .btn-secondary:hover { color:var(--text); border-color:var(--muted); }
  .btn:disabled { opacity:0.3; cursor:default; transform:none; }
  #results-screen { display:none; text-align:center; }
  #results-screen.active { display:block; }
  .score-circle { width:140px; height:140px; border-radius:50%; border:4px solid var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 24px; background:rgba(232,255,71,0.05); }
  .score-num { font-size:2.8rem; font-weight:800; color:var(--accent); line-height:1; }
  .score-label { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--muted); margin-top:4px; }
  .result-title { font-size:1.6rem; font-weight:800; margin-bottom:8px; }
  .result-sub { color:var(--muted); font-size:0.9rem; margin-bottom:32px; font-family:'IBM Plex Mono',monospace; }
  .qr-section { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:32px; margin-top:32px; text-align:center; }
  .qr-section h3 { font-size:1rem; font-weight:700; margin-bottom:8px; color:var(--accent2); }
  .qr-section p { font-size:0.8rem; color:var(--muted); margin-bottom:20px; font-family:'IBM Plex Mono',monospace; }
  #qrcode { display:inline-block; padding:16px; background:white; border-radius:8px; }
  .review-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:32px; }
  .review-item { aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .review-item.c { background:rgba(71,255,138,0.15); color:var(--correct); border:1px solid rgba(71,255,138,0.3); }
  .review-item.w { background:rgba(255,71,71,0.15); color:var(--wrong); border:1px solid rgba(255,71,71,0.3); }
  .btn-restart { margin-top:24px; background:var(--accent); color:#000; font-family:'Syne',sans-serif; font-weight:700; padding:14px 32px; border:none; border-radius:var(--radius); cursor:pointer; font-size:0.9rem; transition:all 0.2s; }
  .btn-restart:hover { background:#d4eb00; }
  @media(max-width:600px){ header{padding:20px} .progress-wrap{padding:12px 20px} main{padding:24px 16px 60px} .question-card{padding:22px} .review-grid{grid-template-columns:repeat(4,1fr)} }

let currentQ = 0;
let answers = new Array(questions.length).fill(null);
let score = 0;

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === 0 ? ' active' : '');
    card.id = `q-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <div class="q-number">${i+1}</div>
        <span class="q-unit">${q.unit}</span>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts-${i}">
        ${q.options.map((opt, j) => `
          <div class="option" id="opt-${i}-${j}" onclick="selectAnswer(${i},${j})">
            <span class="option-letter">${['A','B','C','D'][j]}</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
      <div class="feedback" id="fb-${i}"></div>
      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="navigate(-1)" ${i===0?'disabled':''}>← Anterior</button>
        <button class="btn btn-primary" id="next-btn-${i}" onclick="${i===questions.length-1?'showResults()':'navigate(1)'}" disabled>
          ${i===questions.length-1?'Ver resultados →':'Siguiente →'}
        </button>
      </div>
    `;
    container.appendChild(card);
  });
  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answers[qIdx] !== null) return;
  answers[qIdx] = optIdx;
  const q = questions[qIdx];
  document.querySelectorAll(`#opts-${qIdx} .option`).forEach(o => o.classList.add('disabled'));
  document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add(optIdx === q.correct ? 'correct' : 'wrong');
  if (optIdx !== q.correct) document.getElementById(`opt-${qIdx}-${q.correct}`).classList.add('correct');
  if (optIdx === q.correct) score++;
  const fb = document.getElementById(`fb-${qIdx}`);
  fb.textContent = (optIdx === q.correct ? '✓ Correcto. ' : '✗ Incorrecto. ') + q.explanation;
  fb.className = 'feedback show ' + (optIdx === q.correct ? 'correct-fb' : 'wrong-fb');
  document.getElementById(`next-btn-${qIdx}`).disabled = false;
  updateProgress();
}

function navigate(dir) {
  document.getElementById(`q-${currentQ}`).classList.remove('active');
  currentQ += dir;
  document.getElementById(`q-${currentQ}`).classList.add('active');
  updateProgress();
}

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
  document.getElementById('progress-text').textContent = `${answered} / ${questions.length}`;
}

function showResults() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('results-screen').classList.add('active');
  document.getElementById('score-num').textContent = score;
  const pct = score / questions.length;
  let title, sub;
  if (pct >= 0.9)      { title='¡Excelente dominio!';    sub='Tienes bases sólidas para la asignatura.'; }
  else if (pct >= 0.7) { title='Buen desempeño';         sub='Refuerza algunos conceptos clave.'; }
  else if (pct >= 0.5) { title='Conocimiento básico';    sub='Se recomienda revisar los temas con más detalle.'; }
  else                 { title='Área de oportunidad';    sub='Es importante repasar los fundamentos de la asignatura.'; }
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = sub + ` (${score}/20 correctas)`;
  const grid = document.getElementById('review-grid');
  answers.forEach((a, i) => {
    const cell = document.createElement('div');
    cell.className = 'review-item ' + (a === questions[i].correct ? 'c' : 'w');
    cell.textContent = i + 1;
    grid.appendChild(cell);
  });
  new QRCode(document.getElementById('qrcode'), {
    text: window.location.href,
    width: 160, height: 160,
    colorDark: '#000000', colorLight: '#ffffff'
  });
}

function restartQuiz() {
  currentQ = 0;
  answers = new Array(questions.length).fill(null);
  score = 0;
  document.getElementById('results-screen').classList.remove('active');
  document.getElementById('results-screen').innerHTML = `
    <div class="score-circle"><div class="score-num" id="score-num">0</div><div class="score-label">/ 20</div></div>
    <div class="result-title" id="result-title">—</div>
    <div class="result-sub" id="result-sub">—</div>
    <div class="review-grid" id="review-grid"></div>
    <button class="btn-restart" onclick="restartQuiz()">↺ Reiniciar examen</button>
    <div class="qr-section">
      <h3>📱 Comparte este examen</h3>
      <p>Escanea el QR para acceder desde cualquier dispositivo</p>
      <div id="qrcode"></div>
      <p style="margin-top:14px;font-size:0.72rem;">Las respuestas se muestran al seleccionar cada opción</p>
    </div>`;
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
}

buildQuiz();
</script>
</body>
</html>
